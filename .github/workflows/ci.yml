name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # Single source of truth; keeps CI on the same interpreter as local dev.
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Fail if the lockfile is stale
        # Renovate's PRs are relocked by the relock job instead.
        if: github.actor != 'renovate[bot]'
        run: uv lock --check

      - name: Run ruff
        run: uv run ruff check custom_components/ tests/

      - name: Check formatting
        run: uv run ruff format --check custom_components/ tests/

      - name: Pyright
        run: uv run pyright custom_components/tailscale_helper/

      - name: Run tests with coverage
        run: |
          set -euo pipefail
          uv run python -m pytest tests/ -v \
            --cov=custom_components.tailscale_helper \
            --cov-report=term-missing \
            --cov-report=html:coverage-html \
            --cov-report=xml:coverage.xml \
            | tee coverage.txt

      - name: Write coverage summary
        if: always()
        run: |
          {
            echo "## Test Coverage"
            echo ""
            echo '```'
            if [ -f coverage.txt ]; then
              sed -n '/Name .* Stmts .* Miss .* Cover/,/TOTAL/p' coverage.txt
            else
              echo "coverage.txt was not generated."
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: |
            coverage.txt
            coverage.xml
            coverage-html/
          if-no-files-found: warn

  relock:
    name: Relock
    if: github.event_name == 'pull_request' && github.actor == 'renovate[bot]'
    runs-on: ubuntu-latest

    permissions:
      # The only job that can write, and only ever for Renovate's own branches.
      contents: write

    steps:
      - name: Check out the pull request branch
        uses: actions/checkout@v7
        with:
          # The default checkout on pull_request is the merge commit, which
          # cannot be pushed back to.
          ref: ${{ github.head_ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Relock
        run: uv lock

      - name: Commit the lockfile if it changed
        run: |
          if git diff --quiet uv.lock; then
            echo "Lockfile already in sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qm "chore: relock" uv.lock
          git push
